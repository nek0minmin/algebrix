name: algebrix
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1

  # State Management
  provider: ^6.1.1

  # Backend & Auth
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2

  # Local Storage & Environment & HTTP
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/mascot/
    - assets/animation/
    - assets/audio/
